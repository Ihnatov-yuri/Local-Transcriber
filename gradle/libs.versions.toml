[versions]
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.09.00"
navigationCompose = "2.8.5"
room = "2.8.5"
media3 = "1.11.1"
datastore = "1.2.1"
coroutines = "1.11.0"
litertlm = "0.17.0"
# sherpa-onnx is no longer a Maven dependency — see app/libs/README.md and
# scripts/fetch-sherpa-onnx.sh. The official k2-fsa AAR bundles its own
# matching libonnxruntime.so per ABI, so there's no separate onnxruntime
# artifact or versioned-symbol pin to maintain here anymore.
serializationJson = "1.11.0"
documentfile = "1.0.1"
commonsCompress = "1.28.0"
commonmark = "0.30.0"
# Backdrop blur for the one Lit Field "veil" glass surface (PlayerBar).
# Auto-selects RuntimeShader (API33+) / multiple-GraphicsLayers (API32) /
# a flat semi-transparent scrim (<=API31, this app's minSdk 29 included) —
# see memory: project-design-migration-lit-field-2026-09. Pinned to the
# last stable release, not the 2.0 RC that shipped days before this was
# written.
haze = "1.7.3"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose BOM keeps every compose lib version-aligned
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

# tar.bz2 extraction for the Parakeet/Omnilingual/Nemotron model archives —
# the JDK's java.util.zip has no bzip2 codec. Pure Java, no native code, no
# transitive deps needed for just the tar + bzip2 readers we use.
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }

# Real CommonMark parsing (tables via the GFM extension, fenced code,
# blockquotes) for post-processing outputs — replaces the hand-rolled
# MarkdownText parser (Phase 5 of the 2026-09 plan). Pure Java, no
# transitive deps beyond each other.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }

# LiteRT-LM Android — Google's runtime for Gemma 4 .litertlm audio models.
# Lives on Google Maven (already in settings.gradle.kts via google()), not Central.
# Replaces the older com.google.mediapipe:tasks-genai which doesn't yet load
# Gemma 4's litertlm format.
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }

# Frosted-glass backdrop blur (Compose Multiplatform, Maven Central).
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No standalone kotlin-android plugin: AGP 9's built-in Kotlin support
# (enabled by default) compiles Kotlin sources without it.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[versions]
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.3.2"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
room = "2.8.4"
media3 = "1.5.1"
datastore = "1.1.1"
coroutines = "1.9.0"
litertlm = "0.11.0"
sherpaOnnx = "8.5.1"
# Pinned to 1.24.3 — sherpa-onnx 8.5.1's libsherpa-onnx-jni.so requires
# `OrtGetApiBase@VERS_1.24.3` (versioned symbol). The bundled
# lib-onnx 6.16.7 ships ORT 1.17.1 (wrong version). Microsoft's 1.26.0
# and 1.19.2 also expose wrong versions. Only Microsoft ORT 1.24.x
# satisfies the exact versioned-symbol dependency.
# Verified via `llvm-readelf --dyn-syms` on the .so files in the APK.
# Bumping requires matching sherpa-onnx version too.
onnxruntime = "1.24.3"
serializationJson = "1.7.3"
documentfile = "1.0.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose BOM keeps every compose lib version-aligned
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

# LiteRT-LM Android — Google's runtime for Gemma 4 .litertlm audio models.
# Lives on Google Maven (already in settings.gradle.kts via google()), not Central.
# Replaces the older com.google.mediapipe:tasks-genai which doesn't yet load
# Gemma 4's litertlm format.
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }

# sherpa-onnx native runtime (community-maintained mirror of k2-fsa/sherpa-onnx
# binaries). Ships libsherpa-onnx-jni.so + ASR Kotlin classes. The diarization
# Kotlin wrapper is vendored under app/src/main/kotlin/com/k2fsa/sherpa/onnx/
# because the upstream Maven artifact omits it; native methods still resolve
# because they're compiled into the shared .so.
sherpa-onnx = { module = "com.bihe0832.android:lib-sherpa-onnx", version.ref = "sherpaOnnx" }

# Microsoft's official onnxruntime — supersedes the older copy that
# sherpa-onnx pulls in transitively (com.bihe0832.android:lib-onnx). The
# transitive copy ships a 4 KB-aligned libonnxruntime.so which fails Android
# 15's 16 KB-page compatibility check. 1.26+ binaries are 16 KB-aligned.
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# BuildConfig generation is enabled per-module via android.buildFeatures.buildConfig = true
# in app/build.gradle.kts (the global default toggle is deprecated in AGP 9+).

kotlin.code.style=official

# KSP2 — fixes "unexpected jvm signature V" on suspend Unit-returning DAO methods
# in KSP 2.1.0-1.0.29 + Room 2.6.1. KSP2 is the long-term implementation.
ksp.useKSP2=true

# ── AGP 9 → 10 transition flags (only the ones we still need) ────────
#
# Most of the per-flag opt-outs were retired with the migration audit on
# 2026-05-18. The four below are kept deliberately. AGP 10 will remove
# the flag itself and bake in the new behavior; that's the deadline.
#
# - builtInKotlin=false: AGP 9 ships its own Kotlin embedded; we explicitly
#   use the kotlin-android plugin via libs.versions.toml so the project
#   pins one Kotlin version end-to-end. Letting AGP pick a second Kotlin
#   silently is a recipe for the "two stdlibs in the classpath" error.
#   Migrate by removing the explicit kotlin plugin AND this flag together.
# - newDsl=false: keeps the legacy `applicationVariants` / `testVariants`
#   variant API available. The warnings about those APIs being obsolete
#   are triggered by plugin internals (KSP/Compose), not by our build
#   script. Migrating means waiting for KSP + the Compose plugin to drop
#   their own usage — we have no fix on our side beyond keeping this flag.
# - r8.strictFullModeForKeepRules=false: release-only; we haven't tested
#   strict keep rules with our ProGuard/R8 config yet. Re-evaluate when
#   we ship a release build.
# - dependency.useConstraints=true: opt-IN to the new constraint-based
#   resolver. Not a deprecation — just stay opted in.

android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=false
android.newDsl=false

# Project-sync speedup. AGP's recommendation: "improves project import
# performance for very large projects." Even on a single-module app
# it shaves a couple seconds off Studio sync by skipping library
# component resolution against project-wide constraints when it
# doesn't add information. Safe to enable; recommended by the AGP
# warning channel on every sync.
android.dependency.excludeLibraryComponentsFromConstraints=true

# Compose compiler reports (optional; flip on while iterating perf)
# androidx.compose.compiler.reports=true
